# Railway config for zebfin-server (service root directory: backend).
# Add a volume mounted at /data, and set DATABASE_URL, ZEBFIN_CORS_ORIGIN,
# ZEBFIN_RP_ID and optionally ZEBFIN_FAUCET_KEY_JSON as variables.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
# One instance only: wallets are local SQLite files on the volume.
numReplicas = 1
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
