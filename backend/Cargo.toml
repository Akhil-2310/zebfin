[workspace]
resolver = "2"
members = ["crates/zebfin-wallet", "crates/zebfin-signer", "crates/zebfin-cli", "crates/zebfin-server", "crates/zebfin-signer-wasm"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
anyhow = "1"
hex = "0.4"
rand = { version = "0.10", default-features = false, features = ["std", "thread_rng", "sys_rng"] }
secrecy = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "signal"] }
tonic = { version = "0.14", features = ["gzip", "tls-webpki-roots"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = "1"
bip0039 = { version = "0.14", features = ["std", "all-languages"] }
rusqlite = { version = "0.37", features = ["time"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = "0.3"
async-trait = "0.1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

# Zcash: pre-releases pinned exactly. These are the first versions with the
# testnet NU7 activation height (4,465,026); the 0.24-series stable crates
# build transactions the post-NU7 testnet rejects.
orchard = { version = "0.16", default-features = false }
pczt = { version = "=0.10.0-pre.1", features = ["io-finalizer", "orchard", "prover", "signer", "spend-finalizer", "tx-extractor"] }
zcash_address = "=0.14.0-pre.1"
zcash_client_backend = { version = "=0.25.0-pre.1", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard", "pczt", "sync", "unstable"] }
zcash_client_sqlite = { version = "=0.23.0-pre.1", features = ["transparent-inputs", "unstable", "orchard", "serde"] }
zcash_keys = { version = "=0.17.0-pre.1", features = ["orchard", "unstable", "unstable-frost"] }
zcash_primitives = "=0.31.0-pre.1"
zcash_proofs = { version = "=0.31.0-pre.1", features = ["bundled-prover"] }
zcash_protocol = "=0.11.0-pre.0"
zip32 = "0.3"
zip321 = "=0.10.0-pre.1"

zebfin-wallet = { path = "crates/zebfin-wallet" }
zebfin-signer = { path = "crates/zebfin-signer" }

[profile.dev.package."*"]
opt-level = 3

# Small, fast signer binary for the browser.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
